name: CI diagnostics expected negative qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expected-negative:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Mono
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mono-devel
      - name: Compile managed diagnostic fixture
        run: dotnet build tests/diagnostics/DiagnosticsTests.csproj -c Release -o dist/diagnostics -m:2
      - name: Intentional primary timeout plus cleanup failure
        shell: python tools/ci/Run.py --shell auto --step 1 "{0}"
        run: python tools/ci/Emit-Negative.py dist/diagnostics/DiagnosticsTests.exe
      - name: Collect bounded CI diagnostics
        if: always()
        env:
          CARBONLUAU_JOB_STATUS: ${{ job.status }}
        run: python tools/ci/Run.py --collect
      - name: Retain bounded CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expected-negative-${{ runner.os }}
          path: ${{ runner.temp }}/carbonluau-ci-diagnostics/upload/
          if-no-files-found: error
          retention-days: 14
