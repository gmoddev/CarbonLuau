name: Tooling baseline contracts
on:
  push:
    paths: ['api/**', 'docs/**', 'AICONTEXT.md', 'README.md', 'CHANGELOG.md', '.gitattributes', 'tools/Test-ToolingContracts.ps1', 'tools/Test-Documents.py', 'tools/*Loot*.py', 'tools/*Release*.py', 'tools/*Release*.ps1', '.github/workflows/tooling-baseline.yml']
  pull_request:
    paths: ['api/**', 'docs/**', 'AICONTEXT.md', 'README.md', 'CHANGELOG.md', '.gitattributes', 'tools/Test-ToolingContracts.ps1', 'tools/Test-Documents.py', 'tools/*Loot*.py', 'tools/*Release*.py', 'tools/*Release*.ps1', '.github/workflows/tooling-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned finite Loot names and deterministic generation
        shell: python "${{ github.workspace }}/tools/ci/Run.py" --shell auto --step 1 "{0}"
        run: |
          python tools/Generate-LootItems.py --check
          python tools/Test-LootItems.py
          python tools/Test-LootBatch.py
          python tools/Test-LootPackageManifest.py
          python tools/Test-LootRunnerReceipts.py
          python tools/Test-LootStack.py
          python tools/Test-LootStackParts.py
          python tools/Test-LootProfileRestore.py
          python tools/Test-LootQualification.py
          python tools/Generate-LootQualification.py --check-public
      - name: Verify documentation coverage, canonical rules and fragments
        shell: python "${{ github.workspace }}/tools/ci/Run.py" --shell auto --step 2 "{0}"
        run: python tools/Test-Documents.py
      - name: Validate API contract schema fixtures
        shell: python "${{ github.workspace }}/tools/ci/Run.py" --shell pwsh --step 3 "{0}"
        run: ./tools/Test-ToolingContracts.ps1
      - name: Read-only release audit negative fixtures
        shell: python "${{ github.workspace }}/tools/ci/Run.py" --shell auto --step 4 "{0}"
        run: python tools/Test-PublishedRelease.py
      - name: Bundle document navigation fixtures
        shell: python "${{ github.workspace }}/tools/ci/Run.py" --shell pwsh --step 5 "{0}"
        run: ./tools/Test-ReleaseDocumentLinks.ps1
      - name: Collect bounded CI diagnostics
        if: always()
        env:
          CARBONLUAU_JOB_STATUS: ${{ job.status }}
        run: python tools/ci/Run.py --collect
      - name: Retain bounded CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}
          path: ${{ runner.temp }}/carbonluau-ci-diagnostics/upload/
          if-no-files-found: warn
          retention-days: 14
