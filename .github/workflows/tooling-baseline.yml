name: Tooling baseline contracts
on:
  push:
    paths: ['api/**', 'docs/Tooling*.md', 'tools/Test-ToolingContracts.ps1', '.github/workflows/tooling-baseline.yml']
  pull_request:
    paths: ['api/**', 'docs/Tooling*.md', 'tools/Test-ToolingContracts.ps1', '.github/workflows/tooling-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate API contract schema fixtures
        shell: pwsh
        run: ./tools/Test-ToolingContracts.ps1
