name: Tooling Foundations A and B
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check finite pinned Loot manifest generation and drift rejection
        shell: python tools/ci/Run.py --shell bash --step 1 "{0}"
        run: |
          python tools/Generate-LootItems.py --check
          python tools/Test-LootItems.py
          python tools/Generate-Catalog.py --check
          python tools/Test-Catalog.py
          python tools/Test-LootBatch.py
          python tools/Test-LootPackageManifest.py
          python tools/Test-LootRunnerReceipts.py
          python tools/Test-LootStack.py
          python tools/Test-LootStackParts.py
          python tools/Test-LootProfileRestore.py
          python tools/Test-LootQualification.py
          python tools/Generate-LootQualification.py --check-public
      - name: Build independent Core, parser and tooling; check deterministic metadata
        shell: python tools/ci/Run.py --shell pwsh --step 2 "{0}"
        run: ./tools/Build-Tooling.ps1 -Extension build/extension-pack
      - name: Validate API, architecture and server packaging isolation
        shell: python tools/ci/Run.py --shell pwsh --step 3 "{0}"
        run: |
          ./tools/Test-ToolingContracts.ps1
          ./tools/Test-Api.ps1
          ./tools/Test-Architecture.ps1
          ./tools/Test-Release.ps1
      - name: Checkout pinned official editor for catalog integration
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: gmoddev/carbonluau-vscode
          ref: 838ed27c6a627a5e4030f9e64f8744c590842a97
          path: build/catalog-editor-extension
          persist-credentials: false
      - name: Qualify exact catalog completion in actual VS Code
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: python tools/ci/Run.py --shell bash --step 4 "{0}"
        run: |
          npm --prefix build/catalog-editor-extension ci --no-audit --no-fund
          npm --prefix build/catalog-editor-extension run build
          cp -a build/extension-pack/tooling build/catalog-editor-extension/tooling
          # Pair this isolated test fixture truthfully with this runtime candidate.
          # The extension's shipping source pin and the pack identity stay intact.
          python - <<'PY'
          import json, os
          from pathlib import Path
          Root = Path('build/catalog-editor-extension')
          Source = json.loads((Root / 'tooling-source.json').read_text())
          Pack = json.loads((Root / 'tooling/linux-x64/pack.json').read_text())
          assert Pack['SemanticRevision'] == os.environ['GITHUB_SHA']
          assert Pack['ApiVersion'] == Source['ScriptingApi']
          Source['Revision'] = Pack['SemanticRevision']
          (Root / 'tooling-source.json').write_text(json.dumps(Source, indent=2) + '\n')
          PY
          xvfb-run -a node tests/tooling/catalog-vscode/Run.cjs build/catalog-editor-extension "$RUNNER_TEMP/catalog-d9-editor" generated/catalog-symbols.json
      - name: Retain actual editor receipt
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-d9-editor
          path: |
            ${{ runner.temp }}/catalog-d9-editor/result.json
            ${{ runner.temp }}/catalog-d9-editor/vscode.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: tooling-development-${{ matrix.os }}
          path: build/extension-pack/tooling/
          if-no-files-found: error
      - name: Collect bounded CI diagnostics
        if: always()
        env:
          CARBONLUAU_JOB_STATUS: ${{ job.status }}
        run: python tools/ci/Run.py --collect
      - name: Retain bounded CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}
          path: ${{ runner.temp }}/carbonluau-ci-diagnostics/upload/
          if-no-files-found: warn
          retention-days: 14
