name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'release.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify documentation before deployment
        shell: python "${{ github.workspace }}/tools/ci/Run.py" --shell auto --step 1 "{0}"
        run: python tools/Test-Documents.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Collect bounded CI diagnostics
        if: always()
        env:
          CARBONLUAU_JOB_STATUS: ${{ job.status }}
        run: python tools/ci/Run.py --collect
      - name: Retain bounded CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}
          path: ${{ runner.temp }}/carbonluau-ci-diagnostics/upload/
          if-no-files-found: warn
          retention-days: 14
