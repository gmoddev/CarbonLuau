<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CarbonLuau experimental server-side Luau documentation">
  <title>CarbonLuau Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    :root { --theme-color: #18724f; }
    .app-name-link { font-weight: 700; }
    .markdown-section { max-width: 920px; }
    .markdown-section code { border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">Loading CarbonLuau documentation…</div>
  <script>
    window.$docsify = {
      name: 'CarbonLuau',
      repo: 'gmoddev/CarbonLuau',
      homepage: 'Home.md',
      alias: { '/README.md': '/Home.md' },
      loadSidebar: true,
      auto2top: true,
      relativePath: true,
      subMaxLevel: 2,
      search: { placeholder: 'Search documentation', noData: 'No results' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
